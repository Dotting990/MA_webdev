<!DOCTYPE html>
<html>
    <head>
        <title>Styling with color</title>
        <meta charset="UTF-8">
        <style>
            body{
                background-color: deeppink;
            }
            #box{
                height: 75px;
                width: 75px;
                background-color: blue;
                color: white;
                text-align: center;
                border: solid 5px orange;
            }
            #Color{
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
            
                gap: 1px;
            }
            #not{
                height: 75px;
                width: 75px;
                background-color: green;
                color: greenyellow;
                text-align: center;
                border: solid 5px yellow;
            }
            #bot{
                height: 75px;
                width: 75px;
                background-color: red;
                color: blue;
                text-align: center;
                border: solid 5px yellow;
            }



        </style>
    </head>
    <h1></h1>
<body>
        <div id="Color">
            <div id="box">
                <p>Box 1</p>
            </div>
            <div id="not">
                <p>Box 2</p>
            </div> 
            <div id="bot">
                <p>Box 3</p>
        </div>
</body>
</html>
