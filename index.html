<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>Basic Website</title>
        <meta charset="UTF-8">
        <style>
            #imprtant{
                text-decoration:
                underline;
            }
            #dd{
                font-weight: bold;
            }
            #u{
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <h1>Name of the website</h1>
        <p><span id="imprtant">Paragraph tags are used to <b>display</b> most of the text on the <i>webpage.</i></span></p>
        <p><span id="dd">We start a new paragraph</span> tag when we <span id="u">want a new paragraph</span> on the page.<br>This way things are easy to read</p>
    </body>
</html>
