<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>Alignment notes</title>
        <meta charset = "UTF-8">
        <style>
            #box{
                height: 75px;
                width: 75px;
                background-color: blue;
                color: white;
                text-align: center;
            }
            #grid-wrapper{
                display: grid;
                grid-template-columns: 2fr 1fr 100px;
                gap: 5px;
            }
            button{
                margin-top: 25px;
                padding: 25px;
            }
            #flex-wrapper{
                display: none;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
            }
            img{
                width: 200px;
            }


        </style>
    </head>
    <body>
        <h1>Alignment Notes</h1>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRfbuoTbJ7Ba6CwJZv-2-zotye9uUZpiLXvX_OQb201WQ&s=10" alt="Rubiks" id="Rubixs" onmouseout="rotate()">
        <div id="grid-wrapper">
            <div id="box" onmouseover="showHide()">
                <p id="text">Show More</p>
            </div>
            <div id="box">
                <p>Box 2</p>
            </div> 
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
        </div>
        <input type="color" id="newColor">
        <br>
        <button onclick="changeColor()">Click Me!</button>
            
        <script>
            let images = []
            let currentImage = 0
            function rotate(){
                currentImage += 1
                document.getElementById("Rubixs").src =
                images[currentImage]
            }
            function changeColor(){
                let currentColor = document.getElementById
                ("newColor").value
                document.getElementById("box").style.
                backgroundColor = currentColor
            }
            function showHide(){
                let item = document.getElementById
                ("flex-wrapper")
                if(item.style.display == "flex"){
                    item.style.display = none
                    document.getElementById("text")
                    innerHTML = "Show More"
                }else{
                    item.style.display = "flex"//block, flex, none, grid
                    document.getElementById("text")
                    innerHTML = "Show Less"
                }
            }
        </script>
        
    </body>
</html>
